name: AAP-watch-job-by-name
platform: node
blocks:
  - action: assign
    name: Assign_5
    variable: $start_time
    value: Date.now()
  - action: while
    name: While_2
    condition: $loop == true
    blocks:
      - action: if
        name: If_4
        condition: Date.now() - $start_time > $wait_time * 1000
        then:
          - action: throw
            error: '"Waited for "+$wait_time+" seconds but no Job named "+$aap_job_name+"
              showed up..."'
        else: []
      - action: system/Ansible/Tower/Jobs/Jobs List
        name: Ansible_3
        inputs:
          - name: authKey
            value: $AAP_AUTH
          - name: search
            value: $aap_job_name
      - action: if
        name: If_3
        condition: $Ansible_3.result.count > 0
        then:
          - action: foreach
            name: ForEach_1
            list: $Ansible_3.result.results
            blocks:
              - action: if
                name: If_6
                condition: "[\"pending\",\"waiting\", \"running\"].includes($ForEach_1.item.status)"
                then:
                  - action: system/Common/JSON/JSON Parse
                    name: JSONParse_1
                    inputs:
                      - name: jsonString
                        value: $ForEach_1.item.extra_vars
                  - action: if
                    name: If_5
                    condition: $JSONParse_1.result.instance_name == $instance_name
                    then:
                      - action: assign
                        name: Assign_4
                        variable: $loop
                        value: "false"
                      - action: assign
                        name: Assign_6
                        variable: $job_id
                        value: $ForEach_1.item.id
                    else: []
                else: []
        else:
          - action: system/Common/Sleep
            name: Sleep_2
            inputs:
              - name: seconds
                value: "10"
  - action: system/Common/Status Message Update
    name: StatusMessageUpdate_2
    inputs:
      - name: message
        value: '"JOB ID:" + $job_id'
    breakpoint: enabled
  - action: while
    name: While_1
    breakpoint: enabled
    condition: $condition == true
    blocks:
      - action: system/Common/Sleep
        name: Sleep_1
        inputs:
          - name: seconds
            value: "10"
      - action: system/Ansible/Tower/Jobs/Jobs Read 0
        name: Ansible_1
        inputs:
          - name: authKey
            value: $AAP_AUTH
          - name: id
            value: $job_id
      - action: system/Common/Status Message Update
        name: StatusMessageUpdate_1
        inputs:
          - name: message
            value: '"Ping"'
      - action: if
        name: If_1
        condition: $Ansible_1.result.status == "successful"
        then:
          - action: assign
            name: Assign_2
            variable: $condition
            value: "false"
        else:
          - action: if
            name: If_2
            condition: $Ansible_1.result.status == "failed"
            then:
              - action: throw
                error: "\"Error running Job: \" + $aap_job_name"
            else: []
  - action: assign
    name: Assign_1
    variable: $result
    value: $Ansible_1.result.status
  - action: assign
    name: Assign_3
    variable: $output
    value: $Ansible_1.result.artifacts
variables:
  - name: aap_job_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"setup-ec2-instance"'
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: condition
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: boolean
    value: "true"
  - name: output
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  - name: AAP_AUTH
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"admin/aap-test"'
    meta:
      authType: Ansible/Tower
      subType: authentication
  - name: loop
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: boolean
    value: 'true '
  - name: wait_time
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: number
    value: "90"
  - name: start_time
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
  - name: instance_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"cayoback1111"'
  - name: job_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
meta:
  version: 5
  description: Simple Task to Run a singular AWX Job and monitor its status
  layout: flow
  workerGroup: default
finally: null
