name: Update-Credential-By-Name
platform: node
blocks:
  - action: system/Ansible/Tower/Credentials/Credentials List
    name: Ansible_1
    inputs:
      - name: authKey
        value: $auth
      - name: search
        value: $name
  - action: if
    name: If_1
    condition: $Ansible_1.result.count > 1
    then:
      - action: throw
        error: "\"More than one Credential with name: \"+$name"
    else:
      - action: system/Ansible/Tower/Credentials/Credentials Update
        name: Ansible_2
        inputs:
          - name: authKey
            value: $auth
          - name: id
            value: "$Ansible_1.result.results[0].id"
          - name: data
            value: $credential_data
  - action: assign
    name: Assign_1
    variable: $result
    value: |-
      {
          "id": $Ansible_1.result.results[0].id,
          "count": $Ansible_1.result.count
      }
    breakpoint: enabled
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
  - name: auth
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
    meta:
      authType: ANY
      subType: authentication
  - name: name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"Default"'
  - name: credential_data
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
meta:
  version: 5
  description: Update an AWX Credential by Name or other metadata
  layout: flow
  workerGroup: default
finally: null
