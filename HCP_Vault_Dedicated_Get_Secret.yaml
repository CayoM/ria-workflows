name: HCP_Vault_Dedicated_Get_Secret
platform: node
blocks:
  - action: ./HCP_Vault_Dedicated_Auth
    name: Token
    inputs:
      - name: HCP_CLIENT_AUTH
        value: $HCP_AUTH_SECRET
  - action: system/Common/Config Data/Get Config Data
    name: GetConfigData_1
    inputs:
      - name: authKey
        value: $HCP_AUTH_SECRET
  - action: system/Common/HTTP/HTTP Request
    name: Get_Secret
    inputs:
      - name: method
        value: '"GET"'
      - name: host
        value: $GetConfigData_1.result.url + "/v1/admin/secret/data/secrets"
      - name: headers
        value: |-
          {
              "X-Vault-Token": $Token.result
          }
  - action: system/Common/JSON/jq
    name: jq_1
    inputs:
      - name: JSON
        value: $Get_Secret.result
      - name: Filter
        value: '".data.data." + $secret_name'
  - action: assign
    name: Assign_1
    variable: $result
    value: $jq_1.result
    breakpoint: enabled
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
  - name: secret_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"terraform_oauth_token_id"'
  - name: HCP_AUTH_SECRET
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"admin/vault"'
    meta:
      authType: Common/ConfigData
      subType: authentication
meta:
  version: 5
  description: fetch a secret from HCP Vault in the defined path
  layout: flow
  workerGroup: default
finally: null
