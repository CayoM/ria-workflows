name: HCP_Vault_Dedicated_Patch_Secret
platform: node
blocks:
  - action: ./HCP_Vault_Dedicated_Auth
    name: Token
    inputs:
      - name: HCP_CLIENT_AUTH
        value: $HCP_AUTH_SECRET
  - action: system/Common/Config Data/Get Config Data
    name: GetConfigData_1
    inputs:
      - name: authKey
        value: $HCP_AUTH_SECRET
  - action: assign
    name: Assign_1
    variable: $result
    value: "\"{\\\"data\\\": { \\\"\" + $secret_name + \"\\\": \\\"\" + $secret_value\
      \ + \"\\\"}})\""
  - action: system/Common/HTTP/HTTP Request
    name: Set_Secret
    inputs:
      - name: method
        value: '"PATCH"'
      - name: host
        value: $GetConfigData_1.result.url + "/v1/admin/secret/data/secrets"
      - name: headers
        value: |-
          {
              "X-Vault-Token": $Token.result,
              "Content-Type": "application/merge-patch+json"
          }
      - name: body
        value: $result
      - name: bodyEncoding
        value: '"default"'
  - action: exit
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
  - name: secret_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"testsecret"'
  - name: HCP_AUTH_SECRET
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"admin/vault"'
    meta:
      authType: Common/ConfigData
      subType: authentication
  - name: secret_value
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"testvalue123"'
meta:
  version: 5
  description: Patch an existing Secret in HCP Vault Dedicated
  layout: flow
  workerGroup: default
finally: null
